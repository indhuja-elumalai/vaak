<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Vaak</title>
  <meta name="description" content="Vaak — a voice-first study helper that answers in Tamil, Hindi and English.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-60 -60 120 120'%3E%3Cg fill='none' stroke='%236E56F8' stroke-width='7'%3E%3Cellipse rx='48' ry='18'/%3E%3Cellipse rx='48' ry='18' transform='rotate(60)'/%3E%3Cellipse rx='48' ry='18' transform='rotate(120)'/%3E%3C/g%3E%3Ccircle r='13' fill='%2319B4C8'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+Tamil:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem("vaak-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body data-state="idle">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="atom atom-sm" data-atom></span>
        <span class="wordmark">Vaak</span>
        <span class="brand-tag">study helper</span>
      </div>
      <div class="top-actions">
        <span class="model-pill" id="modelPill" hidden></span>
        <button class="icon-btn" id="voiceToggle" type="button" aria-pressed="true" title="Spoken replies on">
          <svg class="icon icon-voice-on" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
          <svg class="icon icon-voice-off" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
        </button>
        <button class="icon-btn" id="themeToggle" type="button" title="Toggle theme">
          <svg class="icon icon-moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main class="scroller" id="scroller">
      <section class="hero" id="hero">
        <span class="atom atom-lg" data-atom></span>
        <h1>Ask in Tamil, Hindi or English.</h1>
        <p class="hero-sub">Vaak listens, decides whether to calculate, convert or look something up, and answers out loud.</p>
        <div class="suggestions" id="suggestions">
          <button type="button" class="suggestion" data-q="What is 37 times 48?"><span class="s-lang">English</span>What is 37 times 48?</button>
          <button type="button" class="suggestion" data-q="Kinetic energy ka formula kya hai?"><span class="s-lang">Hinglish</span>Kinetic energy ka formula kya hai?</button>
          <button type="button" class="suggestion" data-q="25 கிலோகிராம் எத்தனை பவுண்டு?"><span class="s-lang">Tamil</span>25 கிலோகிராம் எத்தனை பவுண்டு?</button>
          <button type="button" class="suggestion" data-q="Photosynthesis na enna? Simple-ah sollu"><span class="s-lang">Tanglish</span>Photosynthesis na enna? Simple-ah sollu</button>
        </div>
      </section>
      <ol class="thread" id="thread" aria-live="polite"></ol>
    </main>

    <footer class="dock">
      <div class="status" id="status" aria-live="polite"></div>
      <form class="composer" id="composer" autocomplete="off">
        <button class="icon-btn" id="attachBtn" type="button" title="Upload an audio question">
          <svg class="icon" viewBox="0 0 24 24"><path d="m21 11-8.5 8.5a5.5 5.5 0 0 1-7.8-7.8L13.2 3.2a3.7 3.7 0 0 1 5.2 5.2L10 16.8a1.8 1.8 0 0 1-2.6-2.6l7.8-7.8"/></svg>
        </button>
        <input type="file" id="fileInput" accept="audio/*" hidden>
        <textarea id="input" rows="1" placeholder="Ask anything…" aria-label="Your question"></textarea>
        <button class="mic-btn" id="micBtn" type="button" title="Speak your question" aria-pressed="false">
          <svg class="icon icon-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <svg class="icon icon-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
        </button>
        <button class="send-btn" id="sendBtn" type="submit" title="Send" disabled>
          <svg class="icon" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </form>
      <p class="footnote" id="footnote">Direct answers come from the language model and can be wrong. Tool results are computed exactly.</p>
    </footer>
  </div>

  <template id="tplUser">
    <li class="msg user">
      <div class="bubble">
        <span class="heard" hidden>
          <svg class="icon" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          <span class="heard-label">Voice</span>
        </span>
        <p class="text"></p>
      </div>
    </li>
  </template>

  <template id="tplAssistant">
    <li class="msg assistant pending">
      <span class="atom atom-xs avatar" data-atom></span>
      <div class="body">
        <p class="thinking">Thinking</p>
        <p class="answer"></p>
        <div class="tools"></div>
        <div class="meta"></div>
        <p class="warn" hidden></p>
      </div>
    </li>
  </template>

  <audio id="player" preload="auto"></audio>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
